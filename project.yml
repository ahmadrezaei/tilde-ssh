# XcodeGen spec. `Tilde.xcodeproj` is generated from this file and committed.
# Regenerate after editing: `xcodegen generate` (brew install xcodegen).
#
# Almost nothing needs regenerating day to day:
#  - Code lives in Packages/TildeKit (Package.swift is plain text; files are discovered by SwiftPM).
#  - App/ folders are Xcode "synchronized folders": add or remove files freely, no project edit needed.
#  - Identifiers and versions live in Config/Shared.xcconfig and are read at build time.
name: Tilde

options:
  minimumXcodeGenVersion: 2.43.0
  createIntermediateGroups: true
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "2700"
  bundleIdPrefix: app.tildessh

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_PREVIEWS: YES

packages:
  TildeKit:
    path: Packages/TildeKit

targets:
  Tilde-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Shared
        type: syncedFolder
      - path: App/iOS
        type: syncedFolder
      - path: App/Resources
        type: syncedFolder
    dependencies:
      - package: TildeKit
        product: TildeCore
      - package: TildeKit
        product: TildeStore
      - package: TildeKit
        product: TildeSecurity
      - package: TildeKit
        product: TildeSSH
      - package: TildeKit
        product: TildeTerminal
      - package: TildeKit
        product: TildeDesign
      - package: TildeKit
        product: TildeFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TILDE_BUNDLE_ID)
        INFOPLIST_FILE: App/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/iOS/Tilde-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  Tilde-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Shared
        type: syncedFolder
      - path: App/macOS
        type: syncedFolder
      - path: App/Resources
        type: syncedFolder
    dependencies:
      - package: TildeKit
        product: TildeCore
      - package: TildeKit
        product: TildeStore
      - package: TildeKit
        product: TildeSecurity
      - package: TildeKit
        product: TildeSSH
      - package: TildeKit
        product: TildeTerminal
      - package: TildeKit
        product: TildeDesign
      - package: TildeKit
        product: TildeFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TILDE_BUNDLE_ID)
        INFOPLIST_FILE: App/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/macOS/Tilde-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Tilde-iOS:
    build:
      targets:
        Tilde-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Tilde-macOS:
    build:
      targets:
        Tilde-macOS: all
    run:
      config: Debug
    archive:
      config: Release
