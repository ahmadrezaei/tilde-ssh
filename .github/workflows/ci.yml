name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the sshd integration tests
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SwiftTerm ships a SwiftPM build-tool plugin; xcodebuild refuses unvalidated plugins in CI.
  XCODEBUILD_FLAGS: -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: App Store metadata limits
        run: scripts/validate-metadata.py
      - name: No secrets in log calls
        run: scripts/check-log-secrets.sh
      - name: Dependency allowlist and pins
        run: scripts/check-dependencies.py
      - name: Plists and entitlements parse
        run: |
          python3 - <<'EOF'
          import plistlib, pathlib, sys
          bad = 0
          for path in [*pathlib.Path("App").rglob("*.plist"), *pathlib.Path("App").rglob("*.entitlements"), *pathlib.Path("App").rglob("*.xcprivacy")]:
              try:
                  plistlib.loads(path.read_bytes())
              except Exception as error:
                  print(f"::error file={path}::{error}")
                  bad = 1
          sys.exit(bad)
          EOF

  package:
    name: TildeKit (build and test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/TildeKit/.build
          key: spm-pkg-${{ runner.os }}-${{ hashFiles('Packages/TildeKit/Package.resolved') }}
          restore-keys: spm-pkg-${{ runner.os }}-
      - name: Build
        working-directory: Packages/TildeKit
        run: swift build
      - name: Test
        working-directory: Packages/TildeKit
        run: swift test

  app:
    name: ${{ matrix.scheme }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Tilde-iOS
            destination: generic/platform=iOS Simulator
          - scheme: Tilde-macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-app-${{ runner.os }}-${{ hashFiles('Packages/TildeKit/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-
      - name: Build
        run: |
          xcodebuild -project Tilde.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -clonedSourcePackagesDirPath .spm \
            $XCODEBUILD_FLAGS \
            build

  # Runs a real OpenSSH server on the runner (GitHub's macOS runners have no Docker) and the TildeSSH
  # integration tests against it. Opt in with the "integration" label on a pull request, or run it manually.
  integration:
    name: sshd integration
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.integration ||
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: macos-26
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/TildeKit/.build
          key: spm-pkg-${{ runner.os }}-${{ hashFiles('Packages/TildeKit/Package.resolved') }}
          restore-keys: spm-pkg-${{ runner.os }}-
      - name: Start sshd
        # The script prints `export NAME=value` lines; GITHUB_ENV wants `NAME=value`.
        # `shell: bash` runs with pipefail, so a failed sshd start fails the job instead of being swallowed by sed.
        shell: bash
        run: scripts/ci-sshd.sh start | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: Packages/TildeKit
        run: swift test --filter TildeSSHTests
      - name: Stop sshd
        if: always()
        run: scripts/ci-sshd.sh stop
